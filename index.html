<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Meta Quest Tower Defense</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json" crossorigin="use-credentials">
    <meta name="theme-color" content="#00ffff">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- A-Frame Extras for movement controls -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="game.js"></script>
  </head>
  <body>
    <a-scene game-manager background="color: #050505">
      <a-assets>
        <!-- User's local dark cyberpunk music file. Make sure to name it exactly 'music.mp3' and upload it to the repo root -->
        <audio id="bgm" src="music.mp3" autoplay loop></audio>
      </a-assets>

      <!-- Ambient Sound -->
      <a-entity sound="src: #bgm; autoplay: true; loop: true; volume: 0.5"></a-entity>

      <!-- Player Rig for First-Person and Controller navigation -->
      <a-entity id="rig" movement-controls="fly: true; speed: 0.3" position="0 1.6 5">
        <a-camera position="0 0 0" look-controls="pointerLockEnabled: false">
          <!-- Add a cursor for placing towers -->
          <a-entity cursor="rayOrigin: mouse" raycaster="objects: .placeable"></a-entity>
        </a-camera>
        <!-- VR Controllers -->
        <a-entity laser-controls="hand: left" raycaster="objects: .placeable; far: 20"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .placeable; far: 20"></a-entity>
      </a-entity>

      <!-- Tron-like grid floor -->
      <a-plane width="100" height="100" rotation="-90 0 0" material="color: #000000; emissive: #003366; wireframe: true; wireframeLinewidth: 2" class="placeable"></a-plane>

      <!-- Central Core (A Glowing repository of light and energy) -->
      <a-sphere id="core" radius="1" position="0 1 0"
                material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1; transparent: true; opacity: 1">
        <a-light type="point" color="#00ffff" intensity="2" distance="10" position="0 0 0"></a-light>
      </a-sphere>

    </a-scene>
  </body>
</html>
